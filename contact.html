<style>
  .find{display:flex;flex-direction:column}
  .find .eyebrow{margin-bottom:14px}
  .link-grid{flex:1;display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:1fr;gap:16px}
  .link-card{display:flex;flex-direction:column;justify-content:space-between;gap:20px;min-height:140px;
    background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:20px;
    box-shadow:var(--shadow);color:var(--text);text-decoration:none;
    transition:transform .25s,border-color .25s,background .25s}
  .link-card:hover{transform:translateY(-3px);border-color:var(--accent);background:var(--surface-2)}
  .link-top{display:flex;justify-content:space-between;align-items:flex-start}
  .logo{display:grid;place-items:center;width:44px;height:44px;border-radius:12px;
    background:var(--surface-2);border:1px solid var(--border);color:var(--accent);transition:background .25s}
  .link-card:hover .logo{background:var(--surface)}
  .logo svg{width:22px;height:22px;display:block}
  .arr{color:var(--text-muted);font-size:1.15rem;line-height:1;transition:color .2s}
  .link-card:hover .arr{color:var(--accent)}
  .lbl{display:block;font-family:var(--mono);font-size:.75rem;color:var(--text-muted);margin-bottom:2px}
  .val{display:block;font-weight:600;font-size:.95rem;overflow-wrap:anywhere}
  @media(max-width:520px){.link-grid{grid-template-columns:1fr}.link-card{min-height:120px}}
</style>
